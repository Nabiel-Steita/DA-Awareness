<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMPASS Ambassadors – Interactive Map</title>
<style>
:root{
  --bg:transparent; --card:#ffffff; --ink:#0f1d33; --muted:#55657f; --line:#d3dbe8; --brass:#f2b705; --brassbg:#eef3fc;
  --sea:#0033A0; --onsea:#fff; --water:#0033A0; --circ:#0033A0; --grid:rgba(255,255,255,.14);
  --land:#f3f5fa; --landamb:#cfdcf5; --landhov:#adc4ee; --landsel:#8fb0ea; --border:#7f92b8;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--card:#14213a;--ink:#e8eef8;--muted:#9db0cc;--line:#2a3b5c;--brassbg:#1d2a47;--sea:#7aa2f7;--onsea:#0b1530;--water:#0a2766;--circ:#3b74ff;--land:#22314f;--landamb:#35538f;--landhov:#4469b0;--landsel:#5a82cc;--border:#4a5f8a}
}
:root[data-theme="dark"]{--card:#14213a;--ink:#e8eef8;--muted:#9db0cc;--line:#2a3b5c;--brassbg:#1d2a47;--sea:#7aa2f7;--onsea:#0b1530;--water:#0a2766;--circ:#3b74ff;--land:#22314f;--landamb:#35538f;--landhov:#4469b0;--landsel:#5a82cc;--border:#4a5f8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:10px}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.top h1{font:700 19px Georgia,serif;margin:0 auto 0 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 10px;text-align:center;font-size:11px;color:var(--muted)}
.stat b{display:block;font:700 17px Georgia,serif;color:var(--ink);line-height:1.1}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.45}
.chip.tog[aria-pressed="true"]{background:var(--sea);color:var(--onsea);border-color:var(--sea)}
input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;min-width:150px;flex:0 1 200px}
.lab{font-size:11.5px;color:var(--muted);margin-right:2px}
.layout{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:860px){.layout{grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr)}}
.mapbox{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--water)}
#wm{display:block;width:100%;height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#wm.drag{cursor:grabbing}
#wm text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--ink);pointer-events:none}
.cn{cursor:pointer;transition:opacity .15s}
.land{fill:var(--land);stroke:var(--border);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.land.amb{fill:var(--landamb);cursor:pointer}
.land.amb:hover{fill:var(--landhov)}
.land.amb.off{fill:var(--land);cursor:default}
.land.sel{fill:var(--landsel)!important}
.cn.dim{opacity:.12;pointer-events:none}
.cn.sel circle.main{stroke-width:7;filter:drop-shadow(0 0 6px var(--brass))}
.cn:hover circle.main{stroke-width:7}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1}
.hint{position:absolute;left:8px;bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:11px;color:var(--muted);opacity:.92}
#tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none;max-width:220px;z-index:5}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:8px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:200px;max-height:640px;overflow:auto}
.lvl{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;display:inline-block;color:#fff}
.l3{background:#b91c1c}.l2{background:#c2410c}.l1{background:#ca8a04}.l0{background:#15803d}
.kv{display:grid;grid-template-columns:84px 1fr;gap:4px 10px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}.small{font-size:12px}
.hook{display:none;background:var(--brassbg);border-left:4px solid var(--brass);padding:7px 10px;border-radius:6px;margin:10px 0;font-size:13.5px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 10px;font-size:12.5px;margin-bottom:8px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px;flex:none}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.empty b{display:block;font:700 17px Georgia,serif;color:var(--ink);margin-bottom:4px}
.rank{display:grid;gap:4px;margin-top:10px}
.rank button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:13px}
.rank button:hover{border-color:var(--sea)}
.rank .n{margin-left:auto;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🧭 COMPASS Ambassadors — Where we come from</h1>
    <div id="stats" style="display:flex;gap:6px"></div>
  </div>

  <div class="filters">
    <span class="lab">Region:</span><span id="regf" class="row" role="group" aria-label="Filter by region"></span>
    <input type="search" id="q" placeholder="Find a country…" aria-label="Search country">
    <button class="chip tog" id="lines" aria-pressed="true">Lines to Tripoli</button>
  </div>

  <div class="layout">
    <div>
      <div class="mapbox" id="mapbox">
        <svg id="wm" viewBox="0 0 1000 690" role="img" aria-label="Interactive map of ambassador home countries"></svg>
        <div class="zoom">
          <button id="zin" aria-label="Zoom in">+</button>
          <button id="zout" aria-label="Zoom out">−</button>
          <button id="zr" aria-label="Reset view" style="font-size:14px">⟲</button>
        </div>
        <div class="hint">Drag to move · scroll / pinch to zoom · click a country</div>
        <div id="tip"></div>
      </div>
      <div class="legend">
        <span>Circle size = number of ambassadors · shaded countries have ambassadors</span>
        <span>★ Tripoli</span>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

/* ---- map geometry ---- */
const W = 1000, H = 690, lon0 = -20, lon1 = 52, lat0 = -8, lat1 = 40;

const tx = X(13.2), ty = Y(32.9);
const svg = $('#wm');

(function drawMap(){
  let s = '';
  for (let lo = -20; lo <= 50; lo += 10) s += `<line x1="${X(lo)}" y1="0" x2="${X(lo)}" y2="${H}" stroke="var(--grid)" stroke-width=".6"/>`;
  for (let la = -5; la <= 40; la += 10) s += `<line x1="0" y1="${Y(la)}" x2="${W}" y2="${Y(la)}" stroke="var(--grid)" stroke-width=".6"/>`;
  GEO.forEach(([n,d]) => { const cn = GN[n]; s += `<path class="land${cn ? ' amb' : ''}"${cn ? ` data-c="${esc(cn)}"` : ''} d="${d}"/>`; });
  s += `<text x="${X(18)}" y="${Y(24)}" text-anchor="middle" font-size="20" font-weight="700" opacity=".25">LIBYA</text>`;
  s += `<g id="lns" style="pointer-events:none"></g>`;
  ORDER.forEach(cn => {
    const c = C[cn], n = byC[cn].length, x = X(c.lon), y = Y(c.lat), r = 9 + Math.sqrt(n)*5.5;
    s += `<g class="cn" data-c="${esc(cn)}" tabindex="0" role="button" aria-label="${esc(cn)}, ${n} ambassador${n>1?'s':''}">

      <text x="${x.toFixed(1)}" y="${y.toFixed(1)}" dy="0.35em" text-anchor="middle" font-size="${n>9?15:13}" font-weight="800" style="fill:#fff">${n}</text>
      <text x="${x.toFixed(1)}" y="${(y+r+14).toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="650" stroke="var(--landamb)" stroke-width="3" paint-order="stroke">${c.flag} ${esc(cn)}</text></g>`;
  });

        <text x="${tx.toFixed(1)}" y="${(ty-18).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="800" stroke="var(--land)" stroke-width="3" paint-order="stroke">Tripoli, Libya</text>`;

})();

/* ---- filters ---- */
function visible(cn){
  const c = C[cn];
  if (!state.reg.has(c.region)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    return cn.toLowerCase().includes(q) || byC[cn].some(p => p.name.toLowerCase().includes(q));
  }
  return true;
}
function applyFilters(){
  let shown = 0;
  svg.querySelectorAll('.cn').forEach(g => { const v = visible(g.dataset.c); g.classList.toggle('dim', !v); if (v) shown++; });
  svg.querySelectorAll('.land.amb').forEach(p => p.classList.toggle('off', !visible(p.dataset.c)));
  let l = '';
  if (state.lines) ORDER.forEach(cn => { if (!visible(cn)) return; const c = C[cn];
    l += `<line x1="${X(c.lon).toFixed(1)}" y1="${Y(c.lat).toFixed(1)}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${RCOL}" stroke-width="1.4" stroke-dasharray="3 5" opacity=".9"/>`; });
  $('#lns').innerHTML = l;
  if (!state.sel) renderHome();
}
function buildFilters(){
  $('#regf').innerHTML = Object.entries(REG).map(([k,v]) =>
    `<button class="chip" data-reg="${esc(k)}" aria-pressed="true"><i style="background:var(--sea)"></i>${esc(k)}</button>`).join('');
}
buildFilters();
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.reg){ const k = b.dataset.reg; state.reg.has(k) ? state.reg.delete(k) : state.reg.add(k); b.setAttribute('aria-pressed', state.reg.has(k)); applyFilters(); }
  else if (b.id === 'lines'){ state.lines = !state.lines; b.setAttribute('aria-pressed', state.lines); applyFilters(); }
  else if (b.dataset.p){ showPerson(+b.dataset.p); }
  else if (b.dataset.cgo){ selectCountry(b.dataset.cgo, true); }
  else if (b.dataset.back !== undefined){ b.dataset.back ? selectCountry(b.dataset.back) : clearSel(); }
});
$('#q').addEventListener('input', e => {
  state.q = e.target.value.trim(); applyFilters();
  if (state.q){ const m = ORDER.filter(visible); if (m.length === 1) selectCountry(m[0], true); }
});

/* ---- detail panel ---- */
function renderHome(){
  const list = ORDER.filter(visible).sort((a,b) => byC[b].length - byC[a].length || a.localeCompare(b));
  $('#panel').innerHTML = `<div class="empty"><b>Tap a country</b>on the map to see who we have there.</div>
    <div class="small muted">${list.length} countr${list.length===1?'y':'ies'} shown · ${list.reduce((a,c)=>a+byC[c].length,0)} ambassadors</div>
    <div class="rank">${list.map(c => `<button data-cgo="${esc(c)}"><span>${C[c].flag}</span><span>${esc(c)}</span><span class="n">${byC[c].length}</span></button>`).join('') || '<div class="muted small">No country matches these filters.</div>'}</div>`;
}
function setSel(cn){ svg.querySelectorAll('.cn,.land.amb').forEach(g => g.classList.toggle('sel', g.dataset.c === cn)); }
function clearSel(){ state.sel = null; setSel(null); renderHome(); }
function selectCountry(cn, zoom){

  $('#panel').innerHTML = `
    <button class="back" data-back="">← All countries</button>

      <dt>Capital</dt><dd>${esc(c.cap)} · ${esc(c.pop)} people</dd>

const pts = new Map(); let pinch = null;
function setVB(){
  vb.w = Math.min(Math.max(vb.w, W/6), W); vb.h = vb.w * H / W;
  vb.x = Math.min(Math.max(vb.x, 0), W - vb.w); vb.y = Math.min(Math.max(vb.y, 0), H - vb.h);
  svg.setAttribute('viewBox', `${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
}
function zoomAt(f, cx, cy){ // cx,cy in svg units
  const nw = Math.min(Math.max(vb.w / f, W/6), W), k = nw / vb.w;
  vb.x = cx - (cx - vb.x) * k; vb.y = cy - (cy - vb.y) * k; vb.w = nw; setVB();
}
function toSvg(e){ const r = svg.getBoundingClientRect(); return [vb.x + (e.clientX - r.left)/r.width*vb.w, vb.y + (e.clientY - r.top)/r.height*vb.h]; }
function zoomTo(cx, cy, z){ vb.w = W / z; vb.h = H / z; vb.x = cx - vb.w/2; vb.y = cy - vb.h/2; setVB(); }
svg.addEventListener('wheel', e => { e.preventDefault(); const [cx,cy] = toSvg(e); zoomAt(e.deltaY < 0 ? 1.2 : 1/1.2, cx, cy); }, {passive:false});
svg.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false;
  if (pts.size === 1) drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y};
  if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y), w:vb.w}; drag = null; }
});
svg.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const r = svg.getBoundingClientRect();
  if (pts.size === 2 && pinch){
    const [a,b] = [...pts.values()], d = Math.hypot(a.x-b.x,a.y-b.y);
    const mid = toSvg({clientX:(a.x+b.x)/2, clientY:(a.y+b.y)/2});
    zoomAt((pinch.w / vb.w) * (d / pinch.d), mid[0], mid[1]); moved = true; return;
  }
  if (drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 5){ moved = true; svg.classList.add('drag'); }
    if (moved){ vb.x = drag.vx - dx/r.width*vb.w; vb.y = drag.vy - dy/r.height*vb.h; setVB(); }
  }
});
const endP = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size){ drag = null; svg.classList.remove('drag'); } };
svg.addEventListener('pointerup', endP); svg.addEventListener('pointercancel', endP);
svg.addEventListener('click', e => {
  if (moved) { moved = false; return; }
  const g = e.target.closest('[data-c]'); if (g) { if (visible(g.dataset.c)) selectCountry(g.dataset.c); }
  else clearSel();
});
$('#zin').onclick = () => zoomAt(1.4, vb.x + vb.w/2, vb.y + vb.h/2);
$('#zout').onclick = () => zoomAt(1/1.4, vb.x + vb.w/2, vb.y + vb.h/2);
$('#zr').onclick = () => { vb = {x:0,y:0,w:W,h:H}; setVB(); clearSel(); };

/* ---- optional: tell the parent page our height (auto-resizing iframe) ---- */
function sendHeight(){ try { parent.postMessage({compassMapHeight: document.documentElement.scrollHeight}, '*'); } catch(e){} }
new ResizeObserver(sendHeight).observe(document.body); sendHeight();

applyFilters();
</script>
